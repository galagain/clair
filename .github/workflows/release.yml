name: Build and release
on:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            asset: release/Clair-Mac-arm64.dmg
          - os: windows-latest
            platform: windows
            asset: release/Clair-Windows-x64.exe
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Check tag version
        shell: bash
        run: node -e 'if(process.env.GITHUB_REF_NAME!=="v"+require("./package.json").version)process.exit(1)'
      - run: npm run build:native
      - run: npm test
      - run: npm run check
      - if: matrix.platform == 'mac'
        run: npm run dist:mac
      - if: matrix.platform == 'windows'
        run: npm run dist:win
      - run: npm run verify:package
      - if: matrix.platform == 'mac'
        run: npm run qa:mac
      - if: matrix.platform == 'windows'
        run: npm run qa:windows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: clair-${{ matrix.platform }}
          path: ${{ matrix.asset }}
          if-no-files-found: error
          retention-days: 7
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          path: artifacts
          merge-multiple: true
      - name: Checksums
        working-directory: artifacts
        run: sha256sum Clair-Mac-arm64.dmg Clair-Windows-x64.exe > SHA256SUMS.txt
      - name: Publish downloads
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" artifacts/* --verify-tag --latest --title "Clair ${RELEASE_TAG#v}" --notes-file docs/RELEASE.md
